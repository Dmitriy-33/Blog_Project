<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Блог{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav>
    <a href="{% url 'blog_app:post_list' %}">Главная</a>
    {% if user.is_authenticated %}
      <a href="{% url 'blog_app:post_create' %}">Новый пост</a>
      <a href="{% url 'logout' %}">Выйти ({{ user.username }})</a>
    {% else %}
      <a href="{% url 'login' %}">Войти</a>
    {% endif %}
  </nav>
  {% for message in messages %}<p class="alert">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
